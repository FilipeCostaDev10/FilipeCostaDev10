name: Generate Datas

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Utilizar v4 da checkout
      - uses: actions/checkout@v4

      # Utilizar v3 da snk para corrigir o aviso de set-output
      - uses: Platane/snk@v3
        with:
          github_user_name: FilipeCostaDev10 }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Publicação no ramo de saída
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
